name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  rls:
    # Levanta Supabase local (migraciones) y verifica RLS y triggers con
    # scripts/test-rls.mjs. No usa ningún proyecto remoto.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # edge-runtime queda encendido: test:rls llama a la Edge Function
      # aceptar-invitacion (spec 014).
      - run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor
      # La Edge Function solo se sirve con `functions serve` (spec 014).
      - run: |
          supabase functions serve --no-verify-jwt > functions.log 2>&1 &
          timeout 120 bash -c 'until curl -s -X POST http://127.0.0.1:54321/functions/v1/aceptar-invitacion -H "Content-Type: application/json" -d "{}" | grep -q codigo; do sleep 2; done'
      - run: npm run test:rls
